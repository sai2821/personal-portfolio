<header class="header" [class.scrolled]="isScrolled()">
  <div class="container header-container">
    <a href="#" class="logo">
      <span class="logo-text">P Sai <span class="text-gradient">Kumar</span></span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }
    </nav>

    <div class="header-actions">
      <!-- Theme Toggle -->
      <button 
        class="theme-toggle" 
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.currentTheme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        }
      </button>

      <!-- Mobile Menu Toggle -->
      <button 
        class="menu-toggle" 
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="hamburger" [class.open]="isMenuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation -->
  <nav class="nav-mobile" [class.open]="isMenuOpen()">
    @for (link of navLinks; track link.href) {
      <a [href]="link.href" class="nav-link" (click)="closeMenu()">{{ link.label }}</a>
    }
  </nav>
</header>
